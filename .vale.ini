# Where Vale looks for style packages
StylesPath = .vale/styles

# Minimum severity to report — warning catches more than error alone
MinAlertLevel = warning

# Style package to download and use
Packages = Google

# Apply to all markdown files
[*.md]
BasedOnStyles = Google

# Skip YAML frontmatter blocks — critical for your repo
TokenIgnores = (?s)---.*?---

# Title Case is the deliberate heading style in this repo
Google.Headings = NO
# Spaced em dashes ( — ) are used throughout as a deliberate AP/Chicago style choice
Google.EmDash = NO
# "application" is correct in technical documentation
Google.WordList = NO
# "e.g." is standard in technical writing
Google.Latin = NO
# False positives on table cells with single-letter values (: R, : Y, etc.)
Google.Colons = NO
