version: 2

updates:
  # Monitor npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Batch all patch updates into one PR instead of one per package
      patch-updates:
        update-types:
          - "patch"
          - "minor"

  # Monitor GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-updates:
        update-types:
          - "patch"
          - "minor"
