name: Doc Checks

# Runs on PRs touching docs or GitHub config files, and when called from ci.yml
on:
  workflow_call:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
      - ".github/copilot-instructions*"
      - ".github/CODEOWNERS"

permissions:
  contents: read

jobs:
  # Validates frontmatter schema and required fields on every doc
  validate-doc-structure:
    name: Validate docs structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate markdown files under docs/
        shell: bash
        run: |
          set -euo pipefail

          VALID_DOC_TYPES="adr architecture agent process standard technology onboarding"
          VALID_STATUSES="proposed draft accepted deprecated superseded"
          VALID_TAGS="documentation standards formatting linting workflow git ci-cd testing security ai-agent ai-readiness architecture onboarding process tooling maintenance governance"

          # Returns the expected doc_type for a given docs/ subfolder name
          expected_doc_type() {
            case "$1" in
              adrs)         echo "adr" ;;
              architecture) echo "architecture" ;;
              agents)       echo "agent" ;;
              process)      echo "process" ;;
              standards)    echo "standard" ;;
              technologies) echo "technology" ;;
              onboarding)   echo "onboarding" ;;
              *)            echo "" ;;
            esac
          }

          echo "Checking docs directory exists..."
          test -d docs

          mapfile -t files < <(find docs/ -type f -name "*.md" | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No markdown files found under docs/"
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Checking $file"

            # File must not be empty
            if [ ! -s "$file" ]; then
              echo "ERROR: File is empty: $file"
              exit 1
            fi

            # Must open with frontmatter delimiter
            first_line="$(head -n 1 "$file")"
            if [ "$first_line" != "---" ]; then
              echo "ERROR: Missing opening frontmatter delimiter in $file"
              exit 1
            fi

            # Must close frontmatter within first 20 lines
            closing_count="$(head -n 20 "$file" | grep -c '^---$' || true)"
            if [ "$closing_count" -lt 2 ]; then
              echo "ERROR: Missing closing frontmatter delimiter near top of $file"
              exit 1
            fi

            # All required frontmatter fields must be present
            for field in title doc_type status owners last_reviewed tags; do
              grep -q "^${field}:" "$file" || {
                echo "ERROR: Missing ${field} in $file"
                exit 1
              }
            done

            # doc_type must be an approved value
            doc_type_val="$(grep '^doc_type:' "$file" | head -1 | awk '{print $2}')"
            if ! echo "$VALID_DOC_TYPES" | grep -qw "$doc_type_val"; then
              echo "ERROR: Invalid doc_type '$doc_type_val' in $file"
              exit 1
            fi

            # doc_type must match the folder the file lives in
            folder="$(dirname "$file" | awk -F'/' '{print $2}')"
            expected_type="$(expected_doc_type "$folder")"
            if [ -n "$expected_type" ] && [ "$doc_type_val" != "$expected_type" ]; then
              echo "ERROR: doc_type '$doc_type_val' does not match expected '$expected_type' for docs/$folder/ in $file"
              exit 1
            fi

            # status must be an approved value
            status_val="$(grep '^status:' "$file" | head -1 | awk '{print $2}')"
            if ! echo "$VALID_STATUSES" | grep -qw "$status_val"; then
              echo "ERROR: Invalid status '$status_val' in $file"
              exit 1
            fi

            # owners must contain at least one GitHub handle
            owners_line="$(grep '^owners:' "$file" | head -1)"
            if ! echo "$owners_line" | grep -q '@'; then
              echo "ERROR: owners must contain at least one @handle in $file"
              exit 1
            fi

            # last_reviewed must be YYYY-MM-DD
            last_reviewed_val="$(grep '^last_reviewed:' "$file" | head -1 | awk '{print $2}')"
            if ! echo "$last_reviewed_val" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "ERROR: last_reviewed must be YYYY-MM-DD, got '$last_reviewed_val' in $file"
              exit 1
            fi

            # tags must be from the approved vocabulary (max 6)
            tags_line="$(grep '^tags:' "$file" | head -1)"
            tags_content="$(echo "$tags_line" | sed 's/^tags: *\[//; s/\].*//')"
            if [ -n "$tags_content" ]; then
              tag_count=0
              while IFS= read -r raw_tag; do
                tag="$(echo "$raw_tag" | tr -d ' "')"
                [ -z "$tag" ] && continue
                tag_count=$((tag_count + 1))
                if ! echo "$VALID_TAGS" | grep -qw "$tag"; then
                  echo "ERROR: Invalid tag '$tag' in $file (not in approved vocabulary)"
                  exit 1
                fi
              done < <(echo "$tags_content" | tr ',' '\n')
              if [ "$tag_count" -gt 6 ]; then
                echo "ERROR: Too many tags ($tag_count, max 6) in $file"
                exit 1
              fi
            fi

            # title must match the document's H1 heading
            title_val="$(grep '^title:' "$file" | head -1 | sed 's/^title: *//; s/^"//; s/"$//')"
            h1_val="$(grep '^# ' "$file" | head -1 | sed 's/^# //')"
            if [ -z "$h1_val" ]; then
              echo "ERROR: No H1 heading found in $file"
              exit 1
            fi
            if [ "$title_val" != "$h1_val" ]; then
              echo "ERROR: title '$title_val' does not match H1 '$h1_val' in $file"
              exit 1
            fi

            # For ADRs: related must only reference other ADRs
            if [ "$doc_type_val" = "adr" ]; then
              frontmatter="$(awk 'BEGIN{n=0} /^---$/{n++; next} n==1{print}' "$file")"
              bad_refs="$(echo "$frontmatter" | grep -oE '"docs/[^"]*"' | grep -v '"docs/adrs/' || true)"
              if [ -n "$bad_refs" ]; then
                echo "ERROR: ADR related field must only reference other ADRs in $file. Found: $bad_refs"
                exit 1
              fi
            fi
          done

          echo "All markdown files passed structure checks."

  # Ensures ADR files are numbered sequentially with no duplicates
  validate-adr-sequence:
    name: Validate ADR numbering
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ADR numbering is unique and ordered
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d docs/adrs ]; then
            echo "docs/adrs does not exist. Skipping."
            exit 0
          fi

          mapfile -t adrs < <(find docs/adrs -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]-*.md' | sort)

          if [ "${#adrs[@]}" -eq 0 ]; then
            echo "No numbered ADRs found. Skipping."
            exit 0
          fi

          prev=0
          for adr in "${adrs[@]}"; do
            base="$(basename "$adr")"
            num="${base%%-*}"
            current=$((10#$num))

            if [ "$current" -le "$prev" ]; then
              echo "ERROR: ADR numbering not strictly increasing at $base"
              exit 1
            fi

            prev="$current"
          done

          echo "ADR numbering looks good."

  # Ensures all required documentation files exist in the repository
  validate-required-docs:
    name: Validate required docs exist
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required docs exist
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "docs/standards/documentation.md"
            "docs/standards/coding.md"
            "docs/standards/testing.md"
            "docs/standards/folder-structure.md"
            "docs/standards/naming-conventions.md"
            "docs/standards/security.md"
            "docs/process/git-workflow.md"
            "docs/process/commit-messages.md"
            "docs/process/ci-pipeline.md"
            "docs/process/done-criteria.md"
            "docs/process/project-management.md"
            "docs/process/doc-governance.md"
            "docs/process/session-worktree-management.md"
            "docs/agents/capabilities.md"
            "docs/agents/constraints.md"
            "docs/agents/ownership.md"
            "docs/agents/pr-format.md"
            "docs/technologies/stack.md"
            "docs/architecture/README.md"
            "docs/onboarding/README.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required doc missing: $file"
              exit 1
            fi
          done

          echo "All required docs exist."

  # Validates all hyperlinks in markdown files resolve correctly
  link-check:
    name: Check markdown links
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check links in docs
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          folder-path: "docs"

      - name: Check links in README
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          file-path: "README.md"
