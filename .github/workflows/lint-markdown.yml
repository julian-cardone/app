name: Lint Markdown

on:
  pull_request:
    paths:
      - "**/*.md"
  workflow_call:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint:md

  vale:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vale
        run: |
          wget -q https://github.com/errata-ai/vale/releases/download/v3.14.1/vale_3.14.1_Linux_64-bit.tar.gz
          tar -xzf vale_3.14.1_Linux_64-bit.tar.gz vale
          sudo mv vale /usr/local/bin/

      - name: Lint prose
        run: vale docs/
