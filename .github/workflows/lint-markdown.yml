name: Lint Markdown

on:
  pull_request:
    paths:
      - "**/*.md"
  workflow_call:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint:md
