name: PR Title

# Direct trigger handles title edits only — ci.yml handles opened, synchronize, reopened
# via workflow_call. This prevents duplicate runs on standard PR events.
on:
  pull_request:
    types: [edited]
  workflow_call:

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate-title:
    name: Validate PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
