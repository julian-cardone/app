name: CI

# Single entry point for all PR checks. Triggers on the full set of
# pull_request event types including edited.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  markdown-checks:
    name: Lint Markdown
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: ./.github/workflows/markdown-checks.yml

  validate-docs:
    name: Documentation checks
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: ./.github/workflows/validate-docs.yml

  pr-title:
    name: PR title validation
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: ./.github/workflows/pr-title.yml

  frontend-checks:
    name: Frontend checks
    uses: ./.github/workflows/frontend-checks.yml
