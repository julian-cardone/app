name: CI

# Single entry point for all PR checks. Triggers on the full set of
# pull_request event types including edited.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - run: echo "Not a Dependabot PR"

  lint-markdown:
    name: Lint Markdown
    needs: guard
    uses: ./.github/workflows/lint-markdown.yml

  doc-checks:
    name: Documentation checks
    needs: guard
    uses: ./.github/workflows/doc-checks.yml

  pr-title:
    name: PR title validation
    needs: guard
    uses: ./.github/workflows/pr-title.yml
